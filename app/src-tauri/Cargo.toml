[package]
name = "infinitas-utilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "infinitas_utilities_lib"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "7.0.0"
iu-capture = { path = "../../crates/iu-capture" }
iu-core = { path = "../../crates/iu-core" }
iu-ocr = { path = "../../crates/iu-ocr" }
iu-recog = { path = "../../crates/iu-recog" }
iu-server = { path = "../../crates/iu-server" }
iu-db = { path = "../../crates/iu-db" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
tokio = { version = "1.54.1", features = ["time"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
