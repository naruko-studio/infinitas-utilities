[package]
name = "iu-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }

# Spout needs Win32 and D3D11 calls, so unsafe is allowed here (and only here).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
