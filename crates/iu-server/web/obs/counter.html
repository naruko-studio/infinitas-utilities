<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>infinitas-utilities · counter</title>
    <!--
      OBS browser source: today's keystrokes and plays.
      Customize with OBS "Custom CSS", e.g.
        :root { --iu-size: 64px; --iu-color: #ff0; --iu-font: "Bahnschrift"; }
      Query: ?label=0 hides the labels.
    -->
    <style>
      :root {
        --iu-font: "Segoe UI", "Yu Gothic UI", "Microsoft JhengHei UI", sans-serif;
        --iu-color: #ffffff;
        --iu-sub-color: #c8cdd8;
        --iu-size: 48px;
        --iu-shadow: 0 0 6px #000, 0 0 2px #000;
        --iu-align: right;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: var(--iu-font);
        color: var(--iu-color);
        text-shadow: var(--iu-shadow);
        text-align: var(--iu-align);
        font-variant-numeric: tabular-nums;
      }
      .notes {
        font-size: var(--iu-size);
        font-weight: 700;
        line-height: 1.1;
      }
      .sub {
        font-size: calc(var(--iu-size) * 0.4);
        color: var(--iu-sub-color);
      }
      .nolabel .label {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="notes"><span id="notes">0</span></div>
    <div class="sub">
      <span class="label" id="l-keys"></span>
      <span class="label">·</span>
      <span class="label" id="l-plays"></span> <span id="plays">0</span>
    </div>
    <script src="/assets/iu.js"></script>
    <script>
      const t = IU.strings();
      if (new URLSearchParams(location.search).get("label") === "0") {
        document.body.classList.add("nolabel");
      }
      document.getElementById("l-keys").textContent = t.keystrokes;
      document.getElementById("l-plays").textContent = t.plays;
      IU.connect({
        status(s) {
          document.getElementById("notes").textContent = IU.fmt(s.todayNotes);
          document.getElementById("plays").textContent = IU.fmt(s.playsToday);
        },
      });
    </script>
  </body>
</html>
